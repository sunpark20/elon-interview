<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<title>한중어업협정 해역좌표 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: #0a1628;
    color: #e0e8f0;
  }
  .header {
    background: linear-gradient(135deg, #0d2137 0%, #1a3a5c 100%);
    padding: 12px 16px;
    text-align: center;
    border-bottom: 2px solid #2a5a8a;
    position: relative;
    z-index: 1000;
  }
  .header h1 {
    font-size: 15px;
    font-weight: 700;
    color: #7ec8f0;
    margin-bottom: 2px;
  }
  .header p {
    font-size: 10px;
    color: #8a9bb0;
  }
  #map {
    width: 100%;
    height: calc(100vh - 130px);
    z-index: 1;
  }
  .info-bar {
    background: linear-gradient(135deg, #0d2137 0%, #1a3a5c 100%);
    padding: 8px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;
    border-top: 2px solid #2a5a8a;
    font-size: 10px;
    position: relative;
    z-index: 1000;
  }
  .info-bar .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .legend-line {
    width: 18px;
    height: 4px;
    border-radius: 2px;
    display: inline-block;
  }
  .legend-line.zone-a { background: #ffa500; }
  .legend-line.zone-k { background: #44aaff; }
  .legend-line.zone-c { background: #ff4488; }
  .coord-popup {
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
    min-width: 160px;
  }
  .coord-popup .point-name {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
    padding-bottom: 4px;
    border-bottom: 2px solid;
  }
  .coord-popup .zone-label {
    font-size: 10px;
    font-weight: 600;
    margin-bottom: 4px;
    padding: 2px 6px;
    border-radius: 3px;
    display: inline-block;
    color: #fff;
  }
  .coord-popup .coord-row {
    font-size: 12px;
    color: #333;
    line-height: 1.6;
  }
  .coord-popup .label {
    font-weight: 600;
    color: #0d5b94;
  }
  .toggle-btn {
    background: #2a5a8a;
    color: #fff;
    border: none;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 10px;
    cursor: pointer;
  }
  .toggle-btn:active { background: #3a7aba; }
  .marker-label {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .label-a { background: rgba(40, 30, 0, 0.85); color: #ffc755; border: 1px solid #ffa500; }
  .label-k { background: rgba(0, 20, 50, 0.85); color: #66bbff; border: 1px solid #44aaff; }
  .label-c { background: rgba(50, 0, 20, 0.85); color: #ff77aa; border: 1px solid #ff4488; }
</style>
</head>
<body>

<div class="header">
  <h1>한중어업협정 해역좌표</h1>
  <p>잠정조치수역 (제7조) + 과도수역 (제8조)</p>
</div>

<div id="map"></div>

<div class="info-bar">
  <div class="legend-item">
    <span class="legend-line zone-a"></span>
    <span>잠정조치수역 (A)</span>
  </div>
  <div class="legend-item">
    <span class="legend-line zone-k"></span>
    <span>한국측 과도수역 (K)</span>
  </div>
  <div class="legend-item">
    <span class="legend-line zone-c"></span>
    <span>중국측 과도수역 (C)</span>
  </div>
  <button class="toggle-btn" id="toggleLabels">라벨</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
function dms(d, m, s) { return d + m / 60 + (s || 0) / 3600; }

// ========== 잠정조치수역 A1-A17 (제7조) ==========
const pointsA = [
  { name: 'A1',  lat: dms(37, 0),    lng: dms(123, 40),    latStr: '북위 37도 00분',       lngStr: '동경 123도 40분' },
  { name: 'A2',  lat: dms(36, 22, 23), lng: dms(123, 10, 52), latStr: '북위 36도 22분 23초', lngStr: '동경 123도 10분 52초' },
  { name: 'A3',  lat: dms(35, 30),   lng: dms(122, 11, 54), latStr: '북위 35도 30분',       lngStr: '동경 122도 11분 54초' },
  { name: 'A4',  lat: dms(35, 30),   lng: dms(122, 1, 54),  latStr: '북위 35도 30분',       lngStr: '동경 122도 01분 54초' },
  { name: 'A5',  lat: dms(34, 0),    lng: dms(122, 1, 54),  latStr: '북위 34도 00분',       lngStr: '동경 122도 01분 54초' },
  { name: 'A6',  lat: dms(34, 0),    lng: dms(122, 11, 54), latStr: '북위 34도 00분',       lngStr: '동경 122도 11분 54초' },
  { name: 'A7',  lat: dms(33, 20),   lng: dms(122, 41),     latStr: '북위 33도 20분',       lngStr: '동경 122도 41분' },
  { name: 'A8',  lat: dms(32, 20),   lng: dms(123, 45),     latStr: '북위 32도 20분',       lngStr: '동경 123도 45분' },
  { name: 'A9',  lat: dms(32, 11),   lng: dms(123, 49, 30), latStr: '북위 32도 11분',       lngStr: '동경 123도 49분 30초' },
  { name: 'A10', lat: dms(32, 11),   lng: dms(125, 25),     latStr: '북위 32도 11분',       lngStr: '동경 125도 25분' },
  { name: 'A11', lat: dms(33, 20),   lng: dms(124, 8),      latStr: '북위 33도 20분',       lngStr: '동경 124도 08분' },
  { name: 'A12', lat: dms(34, 0),    lng: dms(124, 0, 30),  latStr: '북위 34도 00분',       lngStr: '동경 124도 00분 30초' },
  { name: 'A13', lat: dms(35, 0),    lng: dms(124, 7, 30),  latStr: '북위 35도 00분',       lngStr: '동경 124도 07분 30초' },
  { name: 'A14', lat: dms(35, 30),   lng: dms(124, 30),     latStr: '북위 35도 30분',       lngStr: '동경 124도 30분' },
  { name: 'A15', lat: dms(36, 45),   lng: dms(124, 30),     latStr: '북위 36도 45분',       lngStr: '동경 124도 30분' },
  { name: 'A16', lat: dms(37, 0),    lng: dms(124, 20),     latStr: '북위 37도 00분',       lngStr: '동경 124도 20분' },
  { name: 'A17', lat: dms(37, 0),    lng: dms(123, 40),     latStr: '북위 37도 00분',       lngStr: '동경 123도 40분' },
];

// ========== 한국측 과도수역 K1-K14 (제8조) ==========
const pointsK = [
  { name: 'K1',  lat: dms(35, 30),      lng: dms(124, 30),      latStr: '북위 35도 30분',       lngStr: '동경 124도 30분' },
  { name: 'K2',  lat: dms(35, 0),       lng: dms(124, 7, 30),   latStr: '북위 35도 00분',       lngStr: '동경 124도 07분 30초' },
  { name: 'K3',  lat: dms(34, 0),       lng: dms(124, 0, 30),   latStr: '북위 34도 00분',       lngStr: '동경 124도 00분 30초' },
  { name: 'K4',  lat: dms(33, 20),      lng: dms(124, 8),       latStr: '북위 33도 20분',       lngStr: '동경 124도 08분' },
  { name: 'K5',  lat: dms(32, 11),      lng: dms(125, 25),      latStr: '북위 32도 11분',       lngStr: '동경 125도 25분' },
  { name: 'K6',  lat: dms(32, 11),      lng: dms(126, 45),      latStr: '북위 32도 11분',       lngStr: '동경 126도 45분' },
  { name: 'K7',  lat: dms(32, 40),      lng: dms(127, 0),       latStr: '북위 32도 40분',       lngStr: '동경 127도 00분' },
  { name: 'K8',  lat: dms(32, 24, 30),  lng: dms(126, 17),      latStr: '북위 32도 24분 30초',  lngStr: '동경 126도 17분' },
  { name: 'K9',  lat: dms(32, 29),      lng: dms(125, 57, 30),  latStr: '북위 32도 29분',       lngStr: '동경 125도 57분 30초' },
  { name: 'K10', lat: dms(33, 20),      lng: dms(125, 28),      latStr: '북위 33도 20분',       lngStr: '동경 125도 28분' },
  { name: 'K11', lat: dms(34, 0),       lng: dms(124, 35),      latStr: '북위 34도 00분',       lngStr: '동경 124도 35분' },
  { name: 'K12', lat: dms(34, 25),      lng: dms(124, 33),      latStr: '북위 34도 25분',       lngStr: '동경 124도 33분' },
  { name: 'K13', lat: dms(35, 30),      lng: dms(124, 48),      latStr: '북위 35도 30분',       lngStr: '동경 124도 48분' },
  { name: 'K14', lat: dms(35, 30),      lng: dms(124, 30),      latStr: '북위 35도 30분',       lngStr: '동경 124도 30분' },
];

// ========== 중국측 과도수역 C1-C8 (제8조) ==========
const pointsC = [
  { name: 'C1',  lat: dms(35, 30),  lng: dms(121, 55),  latStr: '북위 35도 30분',  lngStr: '동경 121도 55분' },
  { name: 'C2',  lat: dms(35, 0),   lng: dms(121, 30),  latStr: '북위 35도 00분',  lngStr: '동경 121도 30분' },
  { name: 'C3',  lat: dms(34, 0),   lng: dms(121, 30),  latStr: '북위 34도 00분',  lngStr: '동경 121도 30분' },
  { name: 'C4',  lat: dms(33, 20),  lng: dms(122, 0),   latStr: '북위 33도 20분',  lngStr: '동경 122도 00분' },
  { name: 'C5',  lat: dms(31, 50),  lng: dms(123, 0),   latStr: '북위 31도 50분',  lngStr: '동경 123도 00분' },
  { name: 'C6',  lat: dms(31, 50),  lng: dms(124, 0),   latStr: '북위 31도 50분',  lngStr: '동경 124도 00분' },
  { name: 'C7',  lat: dms(32, 20),  lng: dms(123, 45),  latStr: '북위 32도 20분',  lngStr: '동경 123도 45분' },
  { name: 'C8',  lat: dms(33, 20),  lng: dms(122, 41),  latStr: '북위 33도 20분',  lngStr: '동경 122도 41분' },
];

// 수역별 스타일 설정
const zones = [
  {
    points: pointsA,
    zoneName: '잠정조치수역 (제7조)',
    color: '#ffa500',
    fillColor: '#ffa500',
    markerColor: '#ff8800',
    labelClass: 'label-a',
    popupBorder: '#ffa500',
    popupBg: '#fff3e0',
  },
  {
    points: pointsK,
    zoneName: '한국측 과도수역 (제8조)',
    color: '#44aaff',
    fillColor: '#44aaff',
    markerColor: '#2288dd',
    labelClass: 'label-k',
    popupBorder: '#44aaff',
    popupBg: '#e0f0ff',
  },
  {
    points: pointsC,
    zoneName: '중국측 과도수역 (제8조)',
    color: '#ff4488',
    fillColor: '#ff4488',
    markerColor: '#dd2266',
    labelClass: 'label-c',
    popupBorder: '#ff4488',
    popupBg: '#ffe0ee',
  },
];

// 지도 초기화
const map = L.map('map', {
  center: [33.8, 124],
  zoom: 6,
  minZoom: 5,
  maxZoom: 12,
  zoomControl: false,
  attributionControl: true
});

L.control.zoom({ position: 'bottomright' }).addTo(map);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 18
}).addTo(map);

const allLabels = [];
const allBounds = [];

zones.forEach(z => {
  // 폴리곤
  const coords = z.points.map(p => [p.lat, p.lng]);
  const polygon = L.polygon(coords, {
    color: z.color,
    weight: 3,
    opacity: 0.9,
    fillColor: z.fillColor,
    fillOpacity: 0.12,
    dashArray: '8, 6'
  }).addTo(map);

  allBounds.push(polygon.getBounds());

  // 수역 이름 팝업 (폴리곤 클릭 시)
  polygon.bindPopup(`<div style="font-weight:700;font-size:14px;color:${z.color};">${z.zoneName}</div>`);

  // 마커 + 라벨
  z.points.forEach(p => {
    const marker = L.circleMarker([p.lat, p.lng], {
      radius: 6,
      fillColor: z.markerColor,
      color: '#fff',
      weight: 2,
      opacity: 1,
      fillOpacity: 0.9
    }).addTo(map);

    marker.bindPopup(`
      <div class="coord-popup">
        <div class="zone-label" style="background:${z.color};">${z.zoneName}</div>
        <div class="point-name" style="color:${z.markerColor};border-color:${z.color};">${p.name}</div>
        <div class="coord-row"><span class="label">위도:</span> ${p.latStr}</div>
        <div class="coord-row"><span class="label">경도:</span> ${p.lngStr}</div>
        <div class="coord-row" style="margin-top:4px;font-size:11px;color:#666;">
          ${p.lat.toFixed(4)}°N, ${p.lng.toFixed(4)}°E
        </div>
      </div>
    `);

    const label = L.marker([p.lat, p.lng], {
      icon: L.divIcon({
        className: 'marker-label ' + z.labelClass,
        html: p.name,
        iconSize: null,
        iconAnchor: [-8, 12]
      }),
      interactive: false
    }).addTo(map);

    allLabels.push(label);
  });
});

// 전체 수역 범위에 맞춤
const totalBounds = allBounds[0];
allBounds.slice(1).forEach(b => totalBounds.extend(b));
map.fitBounds(totalBounds.pad(0.1));

// 라벨 토글
let labelsVisible = true;
document.getElementById('toggleLabels').addEventListener('click', () => {
  labelsVisible = !labelsVisible;
  allLabels.forEach(label => {
    labelsVisible ? label.addTo(map) : map.removeLayer(label);
  });
});

map.on('zoomend', () => {
  const show = map.getZoom() >= 6;
  allLabels.forEach(label => {
    (labelsVisible && show) ? label.addTo(map) : map.removeLayer(label);
  });
});
</script>
</body>
</html>
